<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>zylos-browser-remote — bilibili 实跑录屏</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e7eaf0; --dim: #9aa3b2; --accent: #4c9aff; --ok: #46c08d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .sub code { color: var(--fg); background: #1d2129; padding: 1px 5px; border-radius: 4px; }

  .stage { background: #000; border: 1px solid var(--line); border-radius: 10px;
           overflow: hidden; position: relative; line-height: 0; }
  .stage img { width: 100%; height: auto; display: block; }
  .badge { position: absolute; left: 10px; top: 10px; line-height: 1.4;
           background: rgba(0,0,0,.72); color: #fff; font-size: 12px;
           padding: 4px 9px; border-radius: 6px; backdrop-filter: blur(3px); }

  .bar { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
           border-radius: 7px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #3a4252; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .clock { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 96px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--dim); margin: 0 0 10px; font-weight: 600; }

  ol.steps { list-style: none; margin: 0; padding: 0; }
  ol.steps li { padding: 5px 0 5px 10px; border-left: 2px solid var(--line); color: var(--dim); }
  ol.steps li.on { border-left-color: var(--accent); color: var(--fg); }
  ol.steps li.done { border-left-color: #37414f; }
  .t { font-variant-numeric: tabular-nums; color: #6f7b8d; margin-right: 8px; font-size: 12px; }
  .detail { display: block; font-size: 12px; color: #7f8a9b; margin-left: 44px;
            word-break: break-word; }
  ol.steps li.on .detail { color: var(--dim); }

  ul.links { margin: 0; padding-left: 18px; }
  ul.links li { padding: 2px 0; }
  ul.links a { color: var(--accent); text-decoration: none; }
  ul.links a:hover { text-decoration: underline; }

  .facts { margin: 0; }
  .facts div { display: flex; gap: 10px; padding: 3px 0; }
  .facts dt { color: var(--dim); min-width: 92px; }
  .facts dd { margin: 0; word-break: break-all; }
  .note { color: var(--dim); font-size: 12.5px; margin-top: 20px; border-top: 1px solid var(--line);
          padding-top: 14px; }
  .note b { color: var(--fg); font-weight: 600; }
  .ok { color: var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <h1>zylos-browser-remote — bilibili 实跑录屏</h1>
  <div class="sub" id="sub"></div>

  <div class="stage">
    <img id="shot" alt="recorded frame">
    <div class="badge" id="badge"></div>
  </div>

  <div class="bar">
    <button id="play">⏸ 暂停</button>
    <input type="range" id="scrub" min="0" value="0" step="1">
    <span class="clock" id="clock"></span>
  </div>

  <div class="cols">
    <div class="card">
      <h2>这一跑做了什么</h2>
      <ol class="steps" id="steps"></ol>
    </div>
    <div class="card">
      <h2>结果页读回的内容</h2>
      <ul class="links" id="links"></ul>
      <h2 style="margin-top:16px">事实</h2>
      <dl class="facts" id="facts"></dl>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
const DATA = __RUN_DATA__;
const $ = (id) => document.getElementById(id);

const frames = DATA.frames;
const img = $('shot');
let i = 0, playing = true, timer = null;

// Preload: the whole point is that it plays smoothly on first view, and the
// frames total a few MB.
const pre = frames.map((f) => { const im = new Image(); im.src = f.file; return im; });

function fmt(ms) { return (ms / 1000).toFixed(1) + 's'; }

function renderSteps(t) {
  const lis = $('steps').children;
  for (let k = 0; k < DATA.steps.length; k++) {
    const s = DATA.steps[k];
    const next = DATA.steps[k + 1];
    const on = t >= s.t && (!next || t < next.t);
    lis[k].className = on ? 'on' : (t >= s.t ? 'done' : '');
  }
}

function show(n) {
  i = (n + frames.length) % frames.length;
  const f = frames[i];
  img.src = f.file;
  $('scrub').value = i;
  $('clock').textContent = fmt(f.t) + ' / ' + fmt(DATA.durationMs);
  const step = DATA.steps.filter((s) => s.t <= f.t).pop();
  $('badge').textContent = (step ? step.label : '启动中') + '  ·  ' + fmt(f.t);
  renderSteps(f.t);
}

function tick() {
  if (!playing) return;
  timer = setTimeout(() => { show(i + 1); tick(); }, frames[i].hold);
}

$('play').onclick = () => {
  playing = !playing;
  $('play').textContent = playing ? '⏸ 暂停' : '▶ 播放';
  if (playing) tick(); else clearTimeout(timer);
};
$('scrub').max = frames.length - 1;
$('scrub').oninput = (e) => {
  playing = false; clearTimeout(timer); $('play').textContent = '▶ 播放';
  show(Number(e.target.value));
};
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight') { playing = false; clearTimeout(timer); $('play').textContent = '▶ 播放'; show(i + 1); }
  if (e.key === 'ArrowLeft') { playing = false; clearTimeout(timer); $('play').textContent = '▶ 播放'; show(i - 1); }
});

$('sub').innerHTML =
  `真实 Chrome + 真实扩展 + 真实 relay，跑真实站点。录制于 ${DATA.recordedAt}，` +
  `共 ${fmt(DATA.durationMs)}，抓到 ${DATA.capturedFrames} 帧、播放用 ${frames.length} 帧（按真实时间间隔回放）。` +
  ` 搜索词 <code>${DATA.query}</code>。`;

$('steps').innerHTML = DATA.steps.map((s) =>
  `<li><span class="t">${fmt(s.t)}</span>${s.label}` +
  (s.detail ? `<span class="detail">${s.detail.replace(/</g, '&lt;')}</span>` : '') + `</li>`).join('');

$('links').innerHTML = DATA.resultLinks.length
  ? DATA.resultLinks.map((l) => {
      const label = l.label.replace(/<[^>]*>/g, '').replace(/</g, '&lt;').slice(0, 70);
      return `<li><a href="${l.href}" target="_blank" rel="noreferrer noopener">${label || '(无标题)'}</a></li>`;
    }).join('')
  : '<li>（无）</li>';

$('facts').innerHTML = [
  ['入口页', DATA.home],
  ['结果页', DATA.resultsUrl],
  ['结果标题', DATA.resultsTitle],
  ['提交方式', DATA.how],
  ['画面尺寸', `${DATA.size.width}×${DATA.size.height}`],
].map(([k, v]) => `<div><dt>${k}</dt><dd>${String(v).replace(/</g, '&lt;')}</dd></div>`).join('');

$('note').innerHTML =
  '<b>这段画面是怎么来的：</b>操作全部走 relay 的收窄通道，只用 <code>_br.*</code> 动作' +
  '（snapshot / fill / press / navigate / screenshot）——<span class="ok">chokepoint 和 policy 一行未改</span>。' +
  '录制用的是本机测试脚本自己对这个一次性 Chrome 的直连（<code>Page.startScreencast</code>），' +
  '属于“摄像机”，不是给 agent 开的能力：agent 那条 socket 根本碰不到 <code>Page.*</code>。' +
  '<br><b>关于格式：</b>这个容器里没有 ffmpeg，所以没有 mp4。上面是按真实时间间隔回放的帧播放器（最清楚）；' +
  '要一个能直接拖进聊天窗口的文件，用同一批帧生成的 GIF：<a href="run.gif">run.gif</a>' +
  ` (${(DATA.gifBytes / 1e6).toFixed(1)} MB)。` +
  '<br><b>没有登录、没有凭据：</b>用的是全新一次性 Chrome 配置文件，扩展本身拒绝往密码框里打字。';

show(0);
tick();
</script>
</body>
</html>
